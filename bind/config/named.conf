// ── Bind DNS GUI — Sample Configuration ──────────────────────────────
// This is a starting point for your BIND9 DNS server.
// Customise it for your network and domain, then reload BIND.

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";

include "/etc/bind/rndc.key";

// rndc is disabled: bind-gui only needs dynamic updates (nsupdate) authenticated
// with a TSIG key, restricted per zone through update-policy.
//controls { };

controls {
    inet 0.0.0.0 port 953 allow { 172.16.0.0/12; 10.0.0.0/8; 192.168.0.0/16; } keys { "rndc-key"; };
};

// TSIG key "zone1-key" (only authorised for zone1.example.com via update-policy).
// Generate with:  docker compose run --rm bind9 tsig-keygen -a hmac-sha256 zone1-key
include "/etc/bind/bind-gui.key";

// Catalog zones (RFC 9432) — uncomment in Phase 2
//include "/etc/bind/named.conf.catalog";