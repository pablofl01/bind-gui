services:
  bind-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bind9-gui
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - OIDC_SCOPE=${OIDC_SCOPE:-}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS:-}
      - OIDC_ALLOWED_EMAILS=${OIDC_ALLOWED_EMAILS:-}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-}
      - OIDC_DISABLE_PASSWORD=${OIDC_DISABLE_PASSWORD:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - CONFIG_DIR=/app/bind/config
      - BIND_RNDC_HOST=bind9
      - BIND_DNS_HOST=bind9
      - TSIG_KEY_FILE=/etc/bind/bind-gui.key
      - BIND_ZONES=${BIND_ZONES:-}
      - BIND_DNS_PORT=${BIND_DNS_PORT:-53}
    volumes:
      # Mount the BIND config directory (optional)
      #- ../bind/config:/app/bind/config:rw
      - ../bind/config/bind-gui.key:/etc/bind/bind-gui.key:ro
      # Mount the Docker socket (optional — no longer required for zone writes)
      #- /var/run/docker.sock:/var/run/docker.sock:ro
